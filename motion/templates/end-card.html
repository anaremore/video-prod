<!doctype html>
<!-- end-card — full-screen, opaque. The closing call to action. Props: title, subtitle, cta, url. -->
<html lang="en" data-composition-variables='[
  {"id":"title","type":"string","label":"Title","default":"Thanks for watching"},
  {"id":"subtitle","type":"string","label":"Subtitle","default":"New videos every week"},
  {"id":"cta","type":"string","label":"Button","default":"Subscribe"},
  {"id":"url","type":"string","label":"URL / handle","default":""},
  {"id":"c_accent","type":"color","label":"Accent","default":"#22d3ee"},
  {"id":"c_accent2","type":"color","label":"Accent 2","default":"#8b5cf6"},
  {"id":"c_bg","type":"color","label":"Background","default":"#05070d"},
  {"id":"c_panel","type":"color","label":"Panel","default":"#0d1117"},
  {"id":"c_text","type":"color","label":"Text","default":"#f5f7fa"},
  {"id":"c_muted","type":"color","label":"Muted","default":"#9aa4b2"}]'>
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=1920, height=1080" />
  <link rel="stylesheet" href="../fonts/fonts.css" />
  <link rel="stylesheet" href="../themes/base.css" />
  <style>
    .content { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 30px; text-align: center; }
    .title { font-size: calc(118px * var(--display-scale)); color: var(--stage-text); }
    .subtitle { font-size: 40px; font-weight: 500; color: var(--stage-muted); }
    .cta { margin-top: 26px; padding: 24px 56px; border-radius: var(--radius); background: var(--accent); color: var(--bg);
           font-size: calc(44px * var(--display-scale)); box-shadow: var(--panel-shadow); }
    .url { font-size: calc(26px * var(--label-scale)); color: var(--stage-muted); }
  </style>
  <!--THEME-->
  <script src="../vendor/gsap.min.js"></script>
  <script src="../themes/fx.js"></script>
</head>
<body>
  <div id="root" data-composition-id="end-card" data-start="0" data-duration="5" data-fill-duration
       data-width="1920" data-height="1080">
    <div id="e-clip" class="clip" data-start="0" data-duration="5" data-fill-duration data-track-index="0">
      <div id="stage" class="hf-stage">
        <div class="hf-deco hf-deco-grid"></div><div class="hf-deco hf-deco-a"></div><div class="hf-deco hf-deco-b"></div>
        <div class="content">
          <div id="title" class="title hf-display">Thanks for watching</div>
          <div id="subtitle" class="subtitle hf-body">New videos every week</div>
          <div id="cta" class="cta hf-display">Subscribe</div>
          <div id="url" class="url hf-label"></div>
        </div>
      </div>
    </div>
  </div>
  <script>
    (() => {
      const { v, dur, M } = HF.setup();
      const words = HF.words(document.getElementById("title"), v.title);
      const hasSub = HF.text("subtitle", v.subtitle);
      const hasCta = HF.text("cta", v.cta);
      const hasUrl = HF.text("url", v.url);
      const out = Math.max(dur - 0.5, 1.5);
      const tl = gsap.timeline({ paused: true });
      tl.fromTo("#stage", { opacity: 0 }, { opacity: 1, duration: 0.35 }, 0);
      HF.drift(tl, dur);
      tl.fromTo(words, { y: M.enter * 0.5, opacity: 0 }, { y: 0, opacity: 1, duration: M.dur * 1.2, ease: M.ease, stagger: M.stagger }, 0.15);
      if (hasSub) tl.fromTo("#subtitle", { y: 20, opacity: 0 }, { y: 0, opacity: 1, duration: M.dur, ease: M.ease }, 0.45);
      if (hasCta) {
        tl.fromTo("#cta", { scale: 0.6, opacity: 0 }, { scale: 1, opacity: 1, duration: M.dur, ease: M.pop }, 0.7);
        for (let t = 1.6; t < out - 0.8; t += 1.2) {  // a couple of gentle pulses to draw the eye
          tl.to("#cta", { scale: 1.05, duration: 0.3, ease: "sine.out" }, t).to("#cta", { scale: 1, duration: 0.3, ease: "sine.in" }, t + 0.3);
        }
      }
      if (hasUrl) tl.fromTo("#url", { opacity: 0 }, { opacity: 1, duration: M.dur }, 0.9);
      tl.to("#stage", { opacity: 0, duration: 0.45, ease: "power1.in" }, out);
      window.__timelines["end-card"] = tl;
    })();
  </script>
</body>
</html>
