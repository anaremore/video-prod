<!doctype html>
<!-- title-card — full-screen, opaque. Hook / chapter opener: kicker, big title, optional subtitle. -->
<html lang="en" data-composition-variables='[
  {"id":"kicker","type":"string","label":"Kicker","default":"Part 1"},
  {"id":"title","type":"string","label":"Title","default":"The Transcriber"},
  {"id":"subtitle","type":"string","label":"Subtitle","default":"Word-level timestamps with Parakeet"},
  {"id":"c_accent","type":"color","label":"Accent","default":"#22d3ee"},
  {"id":"c_accent2","type":"color","label":"Accent 2","default":"#8b5cf6"},
  {"id":"c_bg","type":"color","label":"Background","default":"#05070d"},
  {"id":"c_panel","type":"color","label":"Panel","default":"#0d1117"},
  {"id":"c_text","type":"color","label":"Text","default":"#f5f7fa"},
  {"id":"c_muted","type":"color","label":"Muted","default":"#9aa4b2"}]'>
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=1920, height=1080" />
  <link rel="stylesheet" href="../fonts/fonts.css" />
  <link rel="stylesheet" href="../themes/base.css" />
  <style>
    .content { position: absolute; left: 160px; right: 160px; top: 0; bottom: 0; display: flex; flex-direction: column; justify-content: center; }
    .kicker { align-self: flex-start; font-size: calc(30px * var(--label-scale)); margin-bottom: 36px; }
    .title { font-size: calc(136px * var(--display-scale)); color: var(--stage-text); }
    .subtitle { margin-top: 34px; font-size: 42px; font-weight: 500; line-height: 1.25; color: var(--stage-muted); max-width: 1400px; }
    .rule { margin-top: 44px; height: 6px; width: 220px; }
  </style>
  <!--THEME-->
  <script src="../vendor/gsap.min.js"></script>
  <script src="../themes/fx.js"></script>
</head>
<body>
  <div id="root" data-composition-id="title-card" data-start="0" data-duration="4" data-fill-duration
       data-width="1920" data-height="1080">
    <div id="card" class="clip" data-start="0" data-duration="4" data-fill-duration data-track-index="0">
      <div id="stage" class="hf-stage">
        <div class="hf-deco hf-deco-grid"></div><div class="hf-deco hf-deco-a"></div><div class="hf-deco hf-deco-b"></div>
        <div class="content">
          <div id="kicker" class="kicker hf-pill hf-label">Part 1</div>
          <div id="title" class="title hf-display">The Transcriber</div>
          <div id="subtitle" class="subtitle hf-body">Word-level timestamps with Parakeet</div>
          <div id="rule" class="rule hf-bar"></div>
        </div>
      </div>
    </div>
  </div>
  <script>
    (() => {
      const { v, dur, M } = HF.setup();
      const hasKicker = HF.text("kicker", v.kicker);
      const hasSub = HF.text("subtitle", v.subtitle);
      const words = HF.words(document.getElementById("title"), v.title);
      const out = Math.max(dur - 0.5, 1.2);
      const tl = gsap.timeline({ paused: true });
      tl.fromTo("#stage", { opacity: 0 }, { opacity: 1, duration: 0.3, ease: "power1.out" }, 0);
      HF.drift(tl, dur);
      if (hasKicker) tl.fromTo("#kicker", { y: 20, opacity: 0 }, { y: 0, opacity: 1, duration: M.dur * 0.9, ease: M.ease }, 0.12);
      tl.fromTo(words, { y: M.enter * 0.6, opacity: 0 }, { y: 0, opacity: 1, duration: M.dur * 1.2, ease: M.ease, stagger: M.stagger }, 0.22);
      if (hasSub) tl.fromTo("#subtitle", { y: 24, opacity: 0 }, { y: 0, opacity: 1, duration: M.dur, ease: M.ease }, 0.5);
      tl.fromTo("#rule", { scaleX: 0 }, { scaleX: 1, duration: M.dur * 1.2, ease: M.ease, transformOrigin: "0% 50%" }, 0.55);
      tl.to("#stage", { opacity: 0, duration: 0.45, ease: "power1.in" }, out);
      window.__timelines["title-card"] = tl;
    })();
  </script>
</body>
</html>
