<!doctype html>
<!-- steps — transparent overlay. A progress tracker (e.g. Cart → Checkout → Transfer → Done) that shows
     where the viewer is in a process. Props: steps ("A, B, C" or JSON array), current (0-based), position. -->
<html lang="en" data-composition-variables='[
  {"id":"steps","type":"string","label":"Steps","default":"Cart, Checkout, Transfer, Done"},
  {"id":"current","type":"number","label":"Current step (0-based)","default":1},
  {"id":"position","type":"enum","label":"Position","default":"top","options":["top","bottom"]},
  {"id":"c_accent","type":"color","label":"Accent","default":"#22d3ee"},
  {"id":"c_accent2","type":"color","label":"Accent 2","default":"#8b5cf6"},
  {"id":"c_bg","type":"color","label":"Background","default":"#05070d"},
  {"id":"c_panel","type":"color","label":"Panel","default":"#0d1117"},
  {"id":"c_text","type":"color","label":"Text","default":"#f5f7fa"},
  {"id":"c_muted","type":"color","label":"Muted","default":"#9aa4b2"}]'>
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=1920, height=1080" />
  <link rel="stylesheet" href="../fonts/fonts.css" />
  <link rel="stylesheet" href="../themes/base.css" />
  <style>
    .row { position: absolute; left: 0; right: 0; display: flex; justify-content: center; }
    .row.top { top: 56px; } .row.bottom { bottom: 64px; }
    .tracker { display: flex; align-items: center; gap: 0; padding: 18px 30px; }
    .step { display: flex; align-items: center; gap: 14px; }
    .dot { width: 44px; height: 44px; border-radius: 50%; display: flex; align-items: center; justify-content: center;
           font-family: var(--font-label); font-weight: 800; font-size: 20px; flex: none;
           border: 3px solid color-mix(in srgb, var(--panel-muted) 70%, transparent); color: var(--panel-muted); }
    .step.done .dot { background: var(--accent); border-color: var(--accent); color: var(--bg); }
    .step.now .dot { border-color: var(--accent); color: var(--accent); }
    .name { font-family: var(--font-body); font-weight: 600; font-size: 26px; color: var(--panel-muted); white-space: nowrap; }
    .step.now .name { color: var(--panel-text); font-weight: 800; }
    .step.done .name { color: var(--panel-text); }
    .link { width: 70px; height: 4px; margin: 0 18px; border-radius: 2px; background: color-mix(in srgb, var(--panel-muted) 35%, transparent); position: relative; overflow: hidden; }
    .link i { position: absolute; inset: 0; background: var(--accent); display: block; }
  </style>
  <!--THEME-->
  <script src="../vendor/gsap.min.js"></script>
  <script src="../themes/fx.js"></script>
</head>
<body>
  <div id="root" data-composition-id="steps" data-start="0" data-duration="4" data-fill-duration
       data-width="1920" data-height="1080">
    <div id="s-clip" class="clip" data-start="0" data-duration="4" data-fill-duration data-track-index="0">
      <div id="row" class="row top"><div id="tracker" class="tracker hf-panel"></div></div>
    </div>
  </div>
  <script>
    (() => {
      const { v, dur, M } = HF.setup();
      let steps;
      try { steps = JSON.parse(v.steps); } catch (e) { steps = String(v.steps).split(/\s*(?:,|→|->|>)\s*/); }
      steps = steps.map(String).filter(Boolean);
      const cur = Math.min(Math.max(Number(v.current) || 0, 0), steps.length - 1);
      document.getElementById("row").className = "row " + (v.position === "bottom" ? "bottom" : "top");
      const tracker = document.getElementById("tracker");
      const links = [];
      steps.forEach((s, i) => {
        if (i) {
          const link = document.createElement("div"); link.className = "link";
          const fill = document.createElement("i"); link.appendChild(fill); tracker.appendChild(link);
          links.push({ fill, done: i <= cur });
        }
        const el = document.createElement("div");
        el.className = "step" + (i < cur ? " done" : i === cur ? " now" : "");
        el.innerHTML = `<div class="dot">${i < cur ? "✓" : i + 1}</div><div class="name"></div>`;
        el.querySelector(".name").textContent = s;
        tracker.appendChild(el);
      });
      const from = v.position === "bottom" ? 40 : -40;
      const tl = gsap.timeline({ paused: true });
      tl.fromTo("#tracker", { y: from, opacity: 0 }, { y: 0, opacity: 1, duration: M.dur, ease: M.ease }, 0.05);
      tl.fromTo(".step", { opacity: 0, x: -14 }, { opacity: 1, x: 0, duration: M.dur * 0.7, ease: M.ease, stagger: M.stagger }, 0.15);
      links.forEach((l, i) => tl.fromTo(l.fill, { scaleX: 0 }, { scaleX: l.done ? 1 : 0, duration: 0.35, ease: M.ease, transformOrigin: "0% 50%" }, 0.3 + i * 0.12));
      const now = document.querySelector(".step.now .dot");
      if (now) tl.fromTo(now, { scale: 0.6 }, { scale: 1, duration: M.dur, ease: M.pop }, 0.55);
      tl.to("#tracker", { y: from, opacity: 0, duration: 0.35, ease: M.easeIn }, Math.max(dur - 0.4, 1));
      window.__timelines["steps"] = tl;
    })();
  </script>
</body>
</html>
