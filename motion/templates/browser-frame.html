<!doctype html>
<!-- browser-frame — full-screen, opaque. A screenshot (from the research step) inside a browser window
     mock; tall screenshots scroll slowly, wide ones get a slow push-in. Props: image, url, caption. -->
<html lang="en" data-composition-variables='[
  {"id":"image","type":"image","label":"Screenshot","default":""},
  {"id":"url","type":"string","label":"URL","default":"hyperframes.heygen.com"},
  {"id":"caption","type":"string","label":"Caption","default":""},
  {"id":"c_accent","type":"color","label":"Accent","default":"#22d3ee"},
  {"id":"c_accent2","type":"color","label":"Accent 2","default":"#8b5cf6"},
  {"id":"c_bg","type":"color","label":"Background","default":"#05070d"},
  {"id":"c_panel","type":"color","label":"Panel","default":"#0d1117"},
  {"id":"c_text","type":"color","label":"Text","default":"#f5f7fa"},
  {"id":"c_muted","type":"color","label":"Muted","default":"#9aa4b2"}]'>
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=1920, height=1080" />
  <link rel="stylesheet" href="../fonts/fonts.css" />
  <link rel="stylesheet" href="../themes/base.css" />
  <style>
    .caption { position: absolute; left: 0; right: 0; top: 54px; text-align: center; font-size: calc(46px * var(--display-scale)); color: var(--stage-text); }
    .win { position: absolute; left: 210px; width: 1500px; overflow: hidden; }
    .chrome { height: 58px; display: flex; align-items: center; gap: 22px; padding: 0 22px;
              background: color-mix(in srgb, var(--panel-text) 8%, var(--panel)); border-bottom: 1px solid color-mix(in srgb, var(--panel-text) 10%, transparent); }
    .dots { display: flex; gap: 10px; }
    .dots i { width: 14px; height: 14px; border-radius: 50%; display: block; }
    .url { flex: 1; height: 36px; border-radius: var(--radius-sm); background: color-mix(in srgb, var(--panel-text) 7%, transparent);
           color: var(--panel-muted); font-weight: 500; font-size: 20px; display: flex; align-items: center; padding: 0 16px; }
    .view { position: relative; width: 1500px; overflow: hidden; background: #fff; }
    .view img { position: absolute; left: 0; top: 0; width: 1500px; height: auto; display: block; }
  </style>
  <!--THEME-->
  <script src="../vendor/gsap.min.js"></script>
  <script src="../themes/fx.js"></script>
</head>
<body>
  <div id="root" data-composition-id="browser-frame" data-start="0" data-duration="5" data-fill-duration
       data-width="1920" data-height="1080">
    <div id="bf-clip" class="clip" data-start="0" data-duration="5" data-fill-duration data-track-index="0">
      <div id="stage" class="hf-stage">
        <div class="hf-deco hf-deco-grid"></div><div class="hf-deco hf-deco-a"></div><div class="hf-deco hf-deco-b"></div>
        <div id="caption" class="caption hf-display"></div>
        <div id="win" class="win hf-panel">
          <div class="chrome">
            <div class="dots"><i style="background:#ff5f57"></i><i style="background:#febc2e"></i><i style="background:#28c840"></i></div>
            <div id="url" class="url hf-body">hyperframes.heygen.com</div>
          </div>
          <div id="view" class="view"><img id="shot" src="" alt="" data-var-src="image" /></div>
        </div>
      </div>
    </div>
  </div>
  <script>
    (() => {
      const { root, v, dur, M } = HF.setup();
      document.getElementById("url").textContent = v.url;
      const hasCaption = HF.text("caption", v.caption);
      const winTop = hasCaption ? 150 : 90;
      const viewH = 1080 - winTop - 58 - 70;
      document.getElementById("win").style.top = winTop + "px";
      document.getElementById("view").style.height = viewH + "px";
      const shot = document.getElementById("shot");
      if (v.image) shot.src = v.image;
      // graphics.py sets data-img-w/h so the scroll distance is known without waiting on layout.
      const iw = parseFloat(root.dataset.imgW || "1500"), ih = parseFloat(root.dataset.imgH || "900");
      const scroll = Math.max(1500 * ih / iw - viewH, 0);
      const out = Math.max(dur - 0.5, 1.2);
      const tl = gsap.timeline({ paused: true });
      tl.fromTo("#stage", { opacity: 0 }, { opacity: 1, duration: 0.3 }, 0);
      HF.drift(tl, dur);
      if (hasCaption) tl.fromTo("#caption", { y: -20, opacity: 0 }, { y: 0, opacity: 1, duration: M.dur, ease: M.ease }, 0.1);
      tl.fromTo("#win", { y: M.enter, opacity: 0, scale: 0.94 }, { y: 0, opacity: 1, scale: 1, duration: M.dur * 1.4, ease: M.ease }, 0.1);
      if (scroll > 0) tl.fromTo("#shot", { y: 0 }, { y: -Math.min(scroll, 1600), duration: Math.max(out - 1.4, 0.5), ease: "power1.inOut" }, 1.0);
      else tl.fromTo("#shot", { scale: 1 }, { scale: 1.06, duration: dur, ease: "none", transformOrigin: "50% 30%" }, 0);
      tl.to("#stage", { opacity: 0, duration: 0.45, ease: "power1.in" }, out);
      window.__timelines["browser-frame"] = tl;
    })();
  </script>
</body>
</html>
